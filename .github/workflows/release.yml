name: Release

# Tag-triggered release build. Pushes the resulting installers and
# mobile artifacts to the GitHub release for that tag. Also runs on
# manual dispatch (no upload to release in that mode — used to smoke
# the matrix without cutting a release).
#
# Required repository secrets for full builds:
#   ANDROID_KEYSTORE_BASE64    base64-encoded upload keystore (.jks)
#   ANDROID_KEYSTORE_ALIAS     keystore alias
#   ANDROID_KEYSTORE_PASSWORD  keystore + key password (same value)
#
# Without those secrets the Android jobs still build but with the
# debug keystore — useful for smoke runs, not for distribution.
#
# Store delivery (tag pushes only; each store job skips with a warning
# when its secrets are missing):
#   PLAY_SERVICE_ACCOUNT_JSON  Google Play service-account key (JSON text).
#                              Phone + TV AABs go to the Play "internal"
#                              testing track; promote them in Play Console.
#   APPSTORE_API_KEY_P8        App Store Connect API key, contents of the
#                              .p8 file (role: Admin, so Xcode can create the
#                              cloud-managed distribution certificate).
#   APPSTORE_API_KEY_ID        That key's Key ID.
#   APPSTORE_API_ISSUER_ID     The team's Issuer ID (Users and Access > Integrations).
#   APPLE_TEAM_ID              Ten-character Apple Developer team ID.
#                              The tvOS build is uploaded to TestFlight.
# Optional repository variable:
#   PLAY_RELEASE_STATUS        "completed" (default) or "draft". Use "draft"
#                              until the Play app has passed its first review;
#                              Play refuses completed releases before that.
#
# Version numbers come from the tag (v0.1.151 -> 0.1.151 / versionCode
# 11510 phone, 11511 TV); see storeVersion() in apps/mobile/app.config.ts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  # Read by apps/mobile/app.config.ts. Manual runs aren't uploaded anywhere,
  # so they build as 0.0.0.
  WHATSON_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0' }}

jobs:
  # ─── Backend: Windows (NSIS .exe + portable .zip) ───
  backend-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Install deps
        run: npm install --legacy-peer-deps
      - name: Build installer
        run: npm run build:installer
      - uses: actions/upload-artifact@v4
        with:
          name: backend-windows
          path: |
            packages/api/installers/whatson-api-*-setup.exe
            packages/api/installers/whatson-api-*-win32-portable.zip
          if-no-files-found: error

  # ─── Backend: Linux (.deb + .rpm + portable tar.gz) ───
  backend-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install fpm + rpm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm
      - name: Install deps
        run: npm install --legacy-peer-deps
      - name: Build installer
        run: npm run build:installer
      - uses: actions/upload-artifact@v4
        with:
          name: backend-linux
          path: |
            packages/api/installers/whatson-api-*.deb
            packages/api/installers/whatson-api-*.rpm
            packages/api/installers/whatson-api-*-linux-portable.tar.gz
          if-no-files-found: error

  # ─── Backend: macOS (.pkg + portable tar.gz) ───
  # macos-latest runners are arm64. Intel Mac users would need a
  # separate matrix job on macos-13 — left as a follow-up.
  backend-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install deps
        run: npm install --legacy-peer-deps
      - name: Build installer
        run: npm run build:installer
      - uses: actions/upload-artifact@v4
        with:
          name: backend-macos
          path: |
            packages/api/installers/whatson-api-*.pkg
            packages/api/installers/whatson-api-*-darwin-portable.tar.gz
          if-no-files-found: error

  # ─── Mobile: Android phone + TV (single matrix job) ───
  # Phone (WHATSON_TV=0) and TV (WHATSON_TV=1) both → com.extrastrength.whatsontv
  # (WHATSON_TV switches assets + leanback flag only, not the package)
  mobile-android:
    runs-on: ubuntu-latest
    # Map keystore secrets up to job-level env so `if:` expressions
    # can gate on their presence. `secrets.*` is NOT available in
    # `if:` expressions directly; `env.*` is.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: phone
            whatson_tv: '0'
            artifact: mobile-android-phone
          - variant: tv
            whatson_tv: '1'
            artifact: mobile-android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - name: Install deps
        run: npm install --legacy-peer-deps
      - name: Build shared
        run: npm run build:shared
      - name: Expo prebuild
        working-directory: apps/mobile
        env:
          WHATSON_TV: ${{ matrix.whatson_tv }}
        run: npx expo prebuild --platform android --no-install
      # Signing — only wire upload keystore when secrets are present.
      # Without it, gradle falls back to debug.keystore which is fine
      # for smoke runs but not for distribution.
      - name: Decode keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > apps/mobile/android/android-keystore.jks
      - name: Configure release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          pushd apps/mobile/android
          echo "WHATSON_UPLOAD_STORE_FILE=$(pwd)/android-keystore.jks" >> gradle.properties
          echo "WHATSON_UPLOAD_KEY_ALIAS=$ANDROID_KEYSTORE_ALIAS" >> gradle.properties
          echo "WHATSON_UPLOAD_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> gradle.properties
          echo "WHATSON_UPLOAD_KEY_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> gradle.properties
          popd
          python3 scripts/patch-signing.py apps/mobile/android/app/build.gradle
      - name: Build AAB + APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew app:bundleRelease app:assembleRelease -x lint -x test --no-daemon
      # Rename outputs so the artifact upload distinguishes phone vs TV.
      - name: Rename outputs
        run: |
          mkdir -p mobile-out
          cp apps/mobile/android/app/build/outputs/bundle/release/*.aab \
             mobile-out/whatson-${{ matrix.variant }}.aab
          cp apps/mobile/android/app/build/outputs/apk/release/*.apk \
             mobile-out/whatson-${{ matrix.variant }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: mobile-out/*
          if-no-files-found: error

  # ─── Mobile: Roku channel ZIP ───
  # Sideload-ready channel package. Not a "store" build — the Roku
  # channel ships through the developer dashboard manually.
  mobile-roku:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package channel
        run: |
          cd apps/roku
          mkdir -p ../../roku-out
          zip -r ../../roku-out/whatson-roku-channel.zip . \
            -x 'PLAN.md' '*.md' 'node_modules/*' '.git*'
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-roku
          path: roku-out/*

  # ─── Store: Google Play (phone + TV AABs → internal testing) ───
  # Both AABs share com.extrastrength.whatsontv and go out in one release:
  # the TV build requires leanback and has the higher versionCode, so TVs get
  # it and phones get the phone build. Play's API cannot create an app, so the
  # very first AAB has to be uploaded by hand in Play Console.
  store-play:
    needs: mobile-android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Check store settings
        id: check
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ] || [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::Skipping Google Play upload: PLAY_SERVICE_ACCOUNT_JSON or the Android keystore secrets are not set."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.ready == 'true'
        with:
          pattern: mobile-android-*
          path: play
          merge-multiple: true
      - name: Upload to Play internal testing
        if: steps.check.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.extrastrength.whatsontv
          releaseFiles: play/whatson-phone.aab,play/whatson-tv.aab
          releaseName: ${{ github.ref_name }}
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

  # ─── Store: Apple TV (tvOS) → TestFlight ───
  # Signing is automatic: Xcode uses the App Store Connect API key to fetch
  # or create the distribution certificate and profile, and the export step
  # uploads straight to App Store Connect.
  store-tvos:
    runs-on: macos-15
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check store settings
        id: check
        run: |
          for n in APPSTORE_API_KEY_P8 APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!n}" ]; then
              echo "::warning::Skipping TestFlight upload: secret $n is not set."
              echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install deps
        if: steps.check.outputs.ready == 'true'
        run: npm install --legacy-peer-deps
      - name: Build shared
        if: steps.check.outputs.ready == 'true'
        run: npm run build:shared
      - name: Expo prebuild (tvOS) + pods
        if: steps.check.outputs.ready == 'true'
        working-directory: apps/mobile
        env:
          WHATSON_TV: '1'
        run: npx expo prebuild --platform ios --clean
      - name: Archive and upload to TestFlight
        if: steps.check.outputs.ready == 'true'
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_$APPSTORE_API_KEY_ID.p8"
          printf '%s\n' "$APPSTORE_API_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY"
                -authenticationKeyID "$APPSTORE_API_KEY_ID"
                -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID")
          xcodebuild archive \
            -workspace WhatsOnTV.xcworkspace -scheme WhatsOnTV \
            -sdk appletvos -configuration Release \
            -destination 'generic/platform=tvOS' \
            -archivePath "$RUNNER_TEMP/WhatsOnTV.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            "${AUTH[@]}"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/WhatsOnTV.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            "${AUTH[@]}"
          rm -f "$KEY"

  # ─── Release: upload all artifacts to the GitHub release ───
  # Only runs on tag pushes — `workflow_dispatch` runs build everything
  # but skip this step so manual smoke runs don't try to publish.
  release:
    needs: [backend-windows, backend-linux, backend-macos, mobile-android, mobile-roku]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp {} release-files/ \;
          ls -la release-files
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          fail_on_unmatched_files: false
          # Auto-generated notes kick in only when the release does
          # NOT already exist. The existing `gh release create v0.1.X
          # --notes "..."` flow keeps working: that creates the
          # release with curated notes first, and this step just
          # appends the platform artifacts. Pushing a tag without
          # pre-creating a release also works — you get a release
          # with default notes that you can edit afterwards.
          generate_release_notes: true
