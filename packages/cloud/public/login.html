<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Whats On</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="nav">
    <div class="brand"><a href="/" style="color:inherit;text-decoration:none">Whats<span>On</span></a></div>
  </div>

  <div class="container">
    <div class="card">
      <h2 id="title">Sign in</h2>
      <p class="sub" id="subtitle">Welcome back. Sign in to manage your servers and devices.</p>

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com" />

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />

      <button class="btn block mt" id="submit-btn" onclick="submitAuth()">Sign in</button>
      <div class="msg" id="msg"></div>

      <p class="center mt muted" style="font-size:14px">
        <span id="toggle-text">New here?</span>
        <a href="#" id="toggle-link" onclick="toggleMode(event)">Create an account</a>
      </p>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    let mode = 'login'; // or 'signup'
    // If already signed in, skip straight to where we were headed.
    if (getToken()) { location.replace(nextUrl()); }

    function nextUrl() {
      const p = new URLSearchParams(location.search).get('next');
      return p && p.startsWith('/') ? p : '/account';
    }

    function toggleMode(e) {
      if (e) e.preventDefault();
      mode = mode === 'login' ? 'signup' : 'login';
      const login = mode === 'login';
      document.getElementById('title').textContent = login ? 'Sign in' : 'Create your account';
      document.getElementById('subtitle').textContent = login
        ? 'Welcome back. Sign in to manage your servers and devices.'
        : 'Create an account to link your server and connect your devices.';
      document.getElementById('submit-btn').textContent = login ? 'Sign in' : 'Create account';
      document.getElementById('toggle-text').textContent = login ? 'New here?' : 'Already have an account?';
      document.getElementById('toggle-link').textContent = login ? 'Create an account' : 'Sign in';
      document.getElementById('password').setAttribute('autocomplete', login ? 'current-password' : 'new-password');
      setMsg('', '');
    }

    async function submitAuth() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submit-btn');
      if (!email || !password) { setMsg('Enter your email and password.', 'err'); return; }
      if (mode === 'signup' && password.length < 8) { setMsg('Password must be at least 8 characters.', 'err'); return; }
      btn.disabled = true; setMsg(mode === 'signup' ? 'Creating account…' : 'Signing in…', '');
      try {
        const path = mode === 'signup' ? '/accounts' : '/accounts/login';
        const r = await apiPost(path, { email, password });
        if (!r.ok) { setMsg(r.body.error || 'Something went wrong.', 'err'); btn.disabled = false; return; }
        setToken(r.body.token);
        location.replace(nextUrl());
      } catch (e) {
        setMsg('Network error: ' + e.message, 'err'); btn.disabled = false;
      }
    }
    document.getElementById('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitAuth(); });
  </script>
</body>
</html>
