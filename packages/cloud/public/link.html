<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Approve a device · Whats On</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="nav">
    <div class="brand"><a href="/" style="color:inherit;text-decoration:none">Whats<span>On</span></a></div>
    <div><a class="btn secondary" href="/account">Account</a></div>
  </div>

  <div class="container">
    <div class="card">
      <h2>Approve a device</h2>
      <p class="sub">Enter the code shown on your TV or phone, and choose which server it should connect to.</p>

      <label>Device code</label>
      <div class="code-inputs">
        <input id="code1" type="text" maxlength="4" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="WXYZ" aria-label="code first part" />
        <span class="dash">–</span>
        <input id="code2" type="text" maxlength="4" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="1234" aria-label="code second part" />
      </div>

      <label for="server">Server</label>
      <select id="server" style="width:100%;padding:12px 14px;background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:9px;font-size:15px">
        <option value="">Loading your servers…</option>
      </select>

      <button class="btn block mt" id="approve-btn" onclick="approve()">Approve device</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    const readCode = wireCodeInput('code1', 'code2');
    // Pre-fill the code if it came in via ?user_code= (RFC 8628 verification_uri_complete)
    const pre = new URLSearchParams(location.search).get('user_code');
    if (pre) fillCodeInput('code1', 'code2', pre);
    if (requireAuth()) loadServers();

    async function loadServers() {
      const r = await apiGet('/accounts/me');
      if (r.status === 401) { clearToken(); location.replace('/login?next=/link'); return; }
      const sel = document.getElementById('server');
      sel.textContent = '';
      // Owned servers AND servers this account is a guest of — a guest approves
      // their own devices from the same page (the server derives the right role).
      const owned = (r.body && r.body.servers) || [];
      const guest = (r.body && r.body.guestServers) || [];
      const servers = [...owned, ...guest];
      if (!servers.length) {
        const o = document.createElement('option');
        o.value = ''; o.textContent = 'No servers yet — accept an invite or link a server first';
        sel.appendChild(o);
        setMsg('You have no servers yet. Accept an invite, or link your own server on your account page.', 'err');
        return;
      }
      for (const s of servers) {
        const o = document.createElement('option');
        o.value = s.serverId;
        const name = s.label || s.serverId.slice(0, 12) + '…';
        o.textContent = s.role === 'guest' ? name + ' (guest)' : name;
        sel.appendChild(o);
      }
    }

    async function approve() {
      const userCode = readCode();
      const serverId = document.getElementById('server').value;
      const btn = document.getElementById('approve-btn');
      if (!userCode) { setMsg('Enter the device code.', 'err'); return; }
      if (!serverId) { setMsg('Choose a server.', 'err'); return; }
      btn.disabled = true; setMsg('Approving…', '');
      // Role is derived server-side from whether you own or are a guest of this server.
      const r = await apiPost('/device-code/approve', { userCode, serverId });
      btn.disabled = false;
      if (!r.ok) { setMsg(r.body.error || 'Could not approve that code.', 'err'); return; }
      setMsg('Approved! Your device will connect in a few seconds — you can close this page.', 'ok');
      document.getElementById('approve-btn').disabled = true;
    }
  </script>
</body>
</html>
